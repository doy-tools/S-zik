name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WebView APK
        uses: open-education-hub/actions-android-build@main
        with:
          app_name: "S Zik"
          package_name: "com.szik.app"
          version_code: "1"
          version_name: "1.0"
          main_activity: "index.html"
          permissions: "INTERNET,CAMERA,RECORD_AUDIO,ACCESS_FINE_LOCATION"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S-Zik-APK
          path: app/build/outputs/apk/debug/app-debug.apk
